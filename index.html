import SwissEph from

/* =========================================================
   CONSTANTS
========================================================= */

const VERSION = "V1.10.1";

const BIRTH = {

const EXPECTED = {

  sidMC:193.40837895694517
};

const SIGNS = [
  "Mesha","Vrishabha","Mithuna","Karka",
  "Simha","Kanya","Tula","Vrischika",
  "Dhanu","Makara","Kumbha","Meena"
];

const SIGN_SYMBOLS = [
  "♈","♉","♊","♋","♌","♍",
  "♎","♏","♐","♑","♒","♓"
];

const PLANETS = [
  {id:0,name:"Sun",short:"Su"},
  {id:1,name:"Moon",short:"Mo"},
  {id:2,name:"Mercury",short:"Me"},
  {id:3,name:"Venus",short:"Ve"},

];

const DASHA_SEQ = [
  "Ketu","Venus","Sun","Moon","Mars",

];

const DASHA_YEARS = {
  Ketu:7,
  Venus:20,
  Sun:6,
  Moon:10,
  Mars:7,
  Rahu:18,
  Jupiter:16,
  Saturn:19,
  Mercury:17
};

const NAKSHATRAS = [
  "Ashwini","Bharani","Krittika","Rohini",
  "Mrigashira","Ardra","Punarvasu","Pushya",
  "Ashlesha","Magha","Purva Phalguni","Uttara Phalguni",
  "Hasta","Chitra","Swati","Vishakha",
  "Anuradha","Jyeshtha","Mula","Purva Ashadha",
  "Uttara Ashadha","Shravana","Dhanishta","Shatabhisha",
  "Purva Bhadrapada","Uttara Bhadrapada","Revati"
];

const NAK_LORDS = [
  "Ketu","Venus","Sun","Moon","Mars","Rahu","Jupiter",
  "Saturn","Mercury","Ketu","Venus","Sun","Moon","Mars",
  "Rahu","Jupiter","Saturn","Mercury","Ketu","Venus","Sun",
  "Moon","Mars","Rahu","Jupiter","Saturn","Mercury"
];

const DAYS_PER_YEAR = 365.25;

const EXALTATION = {
  Sun:0,
  Moon:1,
  Mars:9,
  Mercury:5,
  Jupiter:3,
  Venus:11,
  Saturn:6
};

const DEBILITATION = {
  Sun:6,
  Moon:7,
  Mars:3,
  Mercury:11,
  Jupiter:9,
  Venus:5,
  Saturn:0
};

const OWN_SIGNS = {
  Sun:[4],
  Moon:[3],
  Mars:[0,7],
  Mercury:[2,5],
  Jupiter:[8,11],
  Venus:[1,6],
  Saturn:[9,10]
};

const COMBUSTION_LIMITS = {
  Mercury:14,
  Venus:10,
  Mars:17,
  Jupiter:11,
  Saturn:15
};

/* =========================================================
   HELPERS
========================================================= */

const app = document.getElementById("app");

function esc(v){
  return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function mod(x,n){
  return ((x%n)+n)%n;
}

function signIndex(longitude){
  return Math.floor(mod(longitude,360)/30);
}

function signName(longitude){
  return SIGNS[signIndex(longitude)];
}

function symbol(sign){
  return SIGN_SYMBOLS[signIndex(sign)];
}

function degInSign(longitude){
  return mod(longitude,30);
}

function dms(deg){
  const d=Math.floor(deg);
  const mf=(deg-d)*60;
  const m=Math.floor(mf);
  const s=Math.round((mf-m)*60);

  if(s===60){
    return `${d}°${String(m+1).padStart(2,"0")}′00″`;
  }

  return `${d}°${String(m).padStart(2,"0")}′${String(s).padStart(2,"0")}″`;
}

function fmt(n,d=8){
  return Number(n).toFixed(d);
}

function angularDistance(a,b){
  const x=Math.abs(mod(a-b,360));
  return Math.min(x,360-x);
}

function toUTCDate(){
  return new Date(
    Date.UTC(
      BIRTH.year,
      BIRTH.month-1,
      BIRTH.day,
      BIRTH.hour,
      BIRTH.minute,
      BIRTH.second
    ) - BIRTH.utcOffset*3600000
  );
}

function isoUTC(date){
  return date.toISOString();
}

function utcLabel(date){
  return date.toISOString().replace(".000Z"," UTC");
}

function istLabel(date){
  return new Intl.DateTimeFormat("en-IN",{
    timeZone:"Asia/Kolkata",
    day:"2-digit",
    month:"2-digit",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).format(date)+" IST";
}

function yearsToMs(years){
  return years*DAYS_PER_YEAR*86400000;
}

function durationText(ms){
  if(ms<=0) return "0 days";

  let sec=Math.floor(ms/1000);
  const days=Math.floor(sec/86400);
  sec%=86400;

  const hours=Math.floor(sec/3600);
  sec%=3600;

  const minutes=Math.floor(sec/60);
  sec%=60;

  if(days>0) return `${days} days ${hours}h`;
  return `${hours}h ${minutes}m ${sec}s`;
}

/* =========================================================
   ASTROLOGICAL HELPERS
========================================================= */

function nakshatraInfo(longitude){
  const nsize=360/27;
  const idx=Math.floor(mod(longitude,360)/nsize);
  const within=mod(longitude, nsize);
  const pada=Math.min(4,Math.floor(within/(nsize/4))+1);
  const progress=within/nsize;

  return {
    index:idx,
    name:NAKSHATRAS[idx],
    lord:NAK_LORDS[idx],
    pada,
    progress
  };
}

function dignity(planet,sign){
  if(!(planet in EXALTATION)) return "Neutral";

  if(EXALTATION[planet]===sign) return "Exalted";
  if(DEBILITATION[planet]===sign) return "Debilitated";
  if(OWN_SIGNS[planet]?.includes(sign)) return "Own Sign";

  /*
    Simplified friendship convention retained for V1.10.
    This is an educational comparative label, not a complete
    classical planetary-friendship calculation.
  */

  const friendly = {
    Sun:[0,4],
    Moon:[0,1,3,4],
    Mercury:[1,2,5,6],
    Venus:[1,2,6,9,10],
    Mars:[0,3,8,11],
    Jupiter:[0,3,4,8,11],
    Saturn:[1,2,5,6,9,10]
  };

  const enemy = {
    Sun:[1,6,9,10],
    Moon:[7,9],
    Mercury:[3,7,8,11],
    Venus:[3,5,8],
    Mars:[1,2,5,6,9,10],
    Jupiter:[1,2,5,6,7,9,10],
    Saturn:[0,3,4,7,8,11]
  };

  if(friendly[planet]?.includes(sign)) return "Friendly";
  if(enemy[planet]?.includes(sign)) return "Enemy";

  return "Neutral";
}

function dignityScore(d){
  switch(d){
    case "Exalted": return 100;
    case "Own Sign": return 90;
    case "Friendly": return 70;
    case "Neutral": return 55;
    case "Enemy": return 40;
    case "Debilitated": return 25;
    default:return 55;
  }
}

function strengthAssessment(score){
  if(score>=75) return "Strong";
  if(score>=50) return "Moderate";
  return "Weak";
}

function navamsaSign(longitude){
  const si=signIndex(longitude);
  const internal=degInSign(longitude);
  const nav=Math.min(8,Math.floor(internal/(30/9)));

  let start;

  /*
    Movable: starts from same sign.
    Fixed: starts from 9th sign.
    Dual: starts from 5th sign.
  */

  if([0,3,6,9].includes(si)){
    start=si;
  }else if([1,4,7,10].includes(si)){
    start=mod(si+8,12);
  }else{
    start=mod(si+4,12);
  }

  return mod(start+nav,12);
}

function navamsaDegree(longitude){
  const internal=degInSign(longitude);
  const nav=Math.min(8,Math.floor(internal/(30/9)));
  const within=(internal-nav*(30/9))*9;
  return within;
}

function houseFromLagna(longitude,lagnaLongitude){
  return mod(signIndex(longitude)-signIndex(lagnaLongitude),12)+1;
}

function houseSign(lagnaLongitude,house){
  return mod(signIndex(lagnaLongitude)+house-1,12);
}

function planetDisplay(p){
  return `${p.name}`;
}

/* =========================================================
   SWISS EPHEMERIS
========================================================= */

let swe;

async function initSwiss(){
  swe = new SwissEph();

  /*
    IMPORTANT:
    set_sid_mode is called on the initialized INSTANCE.
    Do not call SwissEph.set_sid_mode().
  */
  await swe.initSwissEph();

  swe.set_sid_mode(
    swe.SE_SIDM_LAHIRI,
    0,
    0
  );
}

function getJD(date){
  return date.getTime()/86400000 + 2440587.5;
}

/* =========================================================
   D1 CALCULATION
========================================================= */

function calculatePlanets(jd){

  const result=[];

  const flags =
    swe.SEFLG_SIDEREAL |
    swe.SEFLG_SPEED;

  for(const p of PLANETS){

    const r=swe.calc_ut(
      jd,
      p.id,
      flags
    );

    result.push({
      name:p.name,
      id:p.id,
      longitude:mod(r[0],360),
      latitude:r[1],
      distance:r[2],
      speed:r[3],
      retrograde:r[3]<0
    });
  }

  const rahu=result.find(x=>x.name==="Rahu");

  result.push({
    name:"Ketu",
    id:11,
    longitude:mod(rahu.longitude+180,360),
    latitude:-rahu.latitude,
    distance:rahu.distance,
    speed:-rahu.speed,
    retrograde:true,
    derived:true
  });

  return result;
}

/* =========================================================
   HOUSES
========================================================= */

function calculateHouses(jd){

  const tropical=swe.houses_ex(
    jd,
    0,
    BIRTH.lat,
    BIRTH.lon,
    "P"
  );

  const sidereal=swe.houses_ex(
    jd,
    swe.SEFLG_SIDEREAL,
    BIRTH.lat,
    BIRTH.lon,
    "P"
  );

  return {
    tropical,
    sidereal
  };
}

/* =========================================================
   D1 DATA
========================================================= */

function buildD1(planets,sidAsc){

  return planets.map(p=>{
    const sign=signIndex(p.longitude);
    const degree=degInSign(p.longitude);
    const nak=nakshatraInfo(p.longitude);

    return {
      ...p,
      sign,
      signName:SIGNS[sign],
      degree,
      house:houseFromLagna(p.longitude,sidAsc),
      nakshatra:nak.name,
      pada:nak.pada,
      nakLord:nak.lord
    };
  });
}

/* =========================================================
   D9 DATA
========================================================= */

function buildD9(planets,sidAsc){

  const lagnaD9=navamsaSign(sidAsc);
  const lagnaDegree=navamsaDegree(sidAsc);

  const d9=planets.map(p=>{
    const sign=navamsaSign(p.longitude);
    const degree=navamsaDegree(p.longitude);

    return {
      ...p,
      d1Sign:signIndex(p.longitude),
      d9Sign:sign,
      d9Degree:degree,
      d9House:mod(sign-lagnaD9,12)+1
    };
  });

  return {
    planets:d9,
    lagnaSign:lagnaD9,
    lagnaDegree
  };
}

/* =========================================================
   DASHA
========================================================= */

function buildMahadashas(birthDate,birthNak){

  const lord=birthNak.lord;
  const startIndex=DASHA_SEQ.indexOf(lord);

  const firstRemaining =
    1-birthNak.progress;

  const firstYears =
    DASHA_YEARS[lord]*firstRemaining;

  const periods=[];

  let cursor=birthDate;

  for(let i=0;i<10;i++){

    const planet=DASHA_SEQ[mod(startIndex+i,9)];

    const years=
      i===0 ? firstYears : DASHA_YEARS[planet];

    const start=cursor;
    const end=new Date(
      start.getTime()+yearsToMs(years)
    );

    periods.push({
      planet,
      years,
      start,
      end,
      index:i
    });

    cursor=end;
  }

  return periods;
}

function buildAntardashas(md){

  const startIndex=DASHA_SEQ.indexOf(md.planet);

  const totalYears=DASHA_YEARS[md.planet];
  const duration=md.end-md.start;

  const list=[];

  let cursor=md.start;

  for(let i=0;i<9;i++){

    const planet=DASHA_SEQ[
      mod(startIndex+i,9)
    ];

    const fraction=
      DASHA_YEARS[planet]/120;

    const length=
      i===8
      ? md.end-cursor
      : duration*fraction;

    const end=
      i===8
      ? md.end
      : new Date(cursor.getTime()+length);

    list.push({
      md:md.planet,
      planet,
      start:cursor,
      end,
      index:i
    });

    cursor=end;
  }

  return list;
}

function buildAllAntardashas(mahadashas){
  const all=[];

  for(const md of mahadashas){
    all.push(...buildAntardashas(md));
  }

  return all;
}

function currentDasha(mahadashas,antardashas,now){

  const md =
    mahadashas.find(
      x=>now>=x.start && now<x.end
    ) || mahadashas[mahadashas.length-1];

  const ad =
    antardashas.find(
      x=>x.md===md.planet &&
      now>=x.start &&
      now<x.end
    );

  return {md,ad};
}

/* =========================================================
   YOGAS
========================================================= */

function detectYogas(d1){

  const result=[];

  const moon=d1.find(x=>x.name==="Moon");
  const jupiter=d1.find(x=>x.name==="Jupiter");

  if(
    moon &&
    jupiter &&
    mod(jupiter.house-moon.house,12)===4 ||
    moon &&
    jupiter &&
    mod(moon.house-jupiter.house,12)===4
  ){
    result.push({
      name:"Gaja Kesari Yoga",
      title:"Wisdom / Reputation",
      text:"Jupiter occupies a kendra from the Moon.",
      planets:"Moon + Jupiter"
    });
  }

  /*
    Dhana screening:
    2nd lord + 5th lord connected by placement.
  */

  const secondLord="Saturn";
  const fifthLord="Mars";

  const saturn=d1.find(x=>x.name===secondLord);
  const mars=d1.find(x=>x.name===fifthLord);

  if(
    saturn &&
    mars &&
    (
      saturn.house===mars.house ||
      angularDistance(saturn.longitude,mars.longitude)<=30
    )
  ){
    result.push({
      name:"Dhana Yoga",
      title:"Wealth Connection",
      text:"Lords of houses 2 and 5 are connected.",
      planets:"Saturn + Mars"
    });
  }

  return result;
}

/* =========================================================
   HOUSE LORDS
========================================================= */

const SIGN_LORDS=[
  "Mars",
  "Venus",
  "Mercury",
  "Moon",
  "Sun",
  "Mercury",
  "Venus",
  "Mars",
  "Jupiter",
  "Saturn",
  "Saturn",
  "Jupiter"
];

function houseLordData(d1,sidAsc){

  const out=[];

  for(let h=1;h<=12;h++){

    const sign=houseSign(sidAsc,h);
    const lord=SIGN_LORDS[sign];

    const lordPlanet=d1.find(
      p=>p.name===lord
    );

    const occupants=d1.filter(
      p=>p.house===h
    );

    out.push({
      house:h,
      sign,
      lord,
      lordHouse:lordPlanet?.house || null,
      occupants
    });
  }

  return out;
}

/* =========================================================
   CONJUNCTIONS
========================================================= */

function conjunctions(d1){

  const out=[];

  for(let i=0;i<d1.length;i++){
    for(let j=i+1;j<d1.length;j++){

      const a=d1[i];
      const b=d1[j];

      const orb=angularDistance(
        a.longitude,
        b.longitude
      );

      if(orb<=10){
        out.push({
          a:a.name,
          b:b.name,
          orb
        });
      }
    }
  }

  return out;
}

/* =========================================================
   DRISHTI
========================================================= */

function aspectsForPlanet(p){

  const normal=[7];

  if(p.name==="Mars"){
    return [4,7,8];
  }

  if(p.name==="Jupiter"){
    return [5,7,9];
  }

  if(p.name==="Saturn"){
    return [3,7,10];
  }

  return normal;
}

function aspectName(n){
  if(n===3)return "3rd";
  if(n===4)return "4th";
  if(n===5)return "5th";
  if(n===7)return "7th";
  if(n===8)return "8th";
  if(n===9)return "9th";
  if(n===10)return "10th";
  return `${n}th`;
}

function buildAspects(d1){

  const out=[];

  for(const p of d1){

    for(const aspect of aspectsForPlanet(p)){

      const targetHouse=
        mod(p.house-1+(aspect-1),12)+1;

      const targets=d1.filter(
        x=>x.house===targetHouse
      );

      out.push({
        planet:p.name,
        fromHouse:p.house,
        aspect,
        targetHouse,
        targets
      });
    }
  }

  return out;
}

/* =========================================================
   COMBUSTION
========================================================= */

function combustionData(d1){

  const sun=d1.find(
    x=>x.name==="Sun"
  );

  return d1.map(p=>{

    const distance=angularDistance(
      p.longitude,
      sun.longitude
    );

    const threshold=
      COMBUSTION_LIMITS[p.name] ?? null;

    let status="—";

    if(threshold!==null){
      status=
        distance<=threshold
        ? "Combust"
        : "No";
    }

    return {
      ...p,
      sunDistance:distance,
      threshold,
      combustion:status
    };
  });
}

/* =========================================================
   STRENGTH
========================================================= */

function strengthData(d1,d9){

  return d1.map(p=>{

    const d1Dignity=dignity(
      p.name,
      p.sign
    );

    const d9p=d9.planets.find(
      x=>x.name===p.name
    );

    const d9Dignity=dignity(
      p.name,
      d9p?.d9Sign ?? 0
    );

    const s1=dignityScore(d1Dignity);
    const s9=dignityScore(d9Dignity);

    const combined=Math.round((s1+s9)/2);

    return {
      name:p.name,
      d1Sign:p.sign,
      d1Dignity,
      d9Sign:d9p?.d9Sign,
      d9Dignity,
      d1Score:s1,
      d9Score:s9,
      combined,
      assessment:
        strengthAssessment(combined)
    };
  });
}

/* =========================================================
   FINANCE
========================================================= */

function financeData(d1,houseLords){

  const selected=[2,5,9,11];

  return selected.map(h=>{
    const row=houseLords.find(
      x=>x.house===h
    );

    return {
      ...row,
      occupants:d1.filter(
        p=>p.house===h
      )
    };
  });
}

/* =========================================================
   MARRIAGE
========================================================= */

function marriageData(d1,d9){

  const seventh=d1.find(
    x=>x.house===7
  );

  const seventhLord=
    SIGN_LORDS[seventh.sign];

  const lordPlanet=d1.find(
    x=>x.name===seventhLord
  );

  const venus=d1.find(
    x=>x.name==="Venus"
  );

  const jupiter=d1.find(
    x=>x.name==="Jupiter"
  );

  const d9SeventhSign=
    mod(d9.lagnaSign+6,12);

  const d9Occupants=
    d9.planets.filter(
      p=>p.d9House===7
    );

  return {
    d1SeventhSign:seventh.sign,
    d1Lord:seventhLord,
    d1LordHouse:lordPlanet?.house,
    venusHouse:venus?.house,
    jupiterHouse:jupiter?.house,
    d9SeventhSign,
    d9Occupants
  };
}

/* =========================================================
   DASH → YOGA / HOUSE CONNECTION
========================================================= */

function dashaConnections(current, d1, yogas){

  const active=[
    current.md?.planet,
    current.ad?.planet
  ].filter(Boolean);

  return active.map(name=>{

    const p=d1.find(
      x=>x.name===name
    );

    const lordOf=[];

    for(let h=1;h<=12;h++){
      if(SIGN_LORDS[
        houseSign(
          EXPECTED.sidAsc,
          h
        )
      ]===name){
        lordOf.push(h);
      }
    }

    const yogaNames=yogas
      .filter(y=>y.planets.includes(name))
      .map(y=>y.name);

    return {
      name,
      house:p?.house,
      sign:p?.sign,
      lordOf,
      yogas:yogaNames
    };
  });
}

/* =========================================================
   VALIDATION
========================================================= */

function validate(data){

  const {
    date,
    jd,
    ayanamsa,
    tropicalHouses,
    siderealHouses,
    sidAsc,
    sidMC,
    d1,
    d9,
    birthNak,
    mahadashas,
    antardashas,
    current,
    conjunctionList,
    aspects,
    houseLords,
    yogas,
    finance,
    marriage
  }=data;

  const checks=[];

  function add(label,detail,pass){
    checks.push({
      label,
      detail,
      pass:!!pass
    });
  }

  add(
    "UTC conversion",
    isoUTC(date),
    isoUTC(date)==="1982-06-30T14:00:00.000Z"
  );

  add(
    "Julian Day",
    `${fmt(jd,8)} — error ${Math.abs(jd-EXPECTED.jd).toFixed(10)}`,
    Math.abs(jd-EXPECTED.jd)<1e-7
  );

  add(
    "Lahiri Ayanamsa",
    `${fmt(ayanamsa,8)}° — error ${Math.abs(ayanamsa-EXPECTED.ayanamsa).toFixed(10)}°`,
    Math.abs(ayanamsa-EXPECTED.ayanamsa)<1e-7
  );

  add(
    "Sidereal Ascendant",
    `${fmt(sidAsc,8)}°`,
    Math.abs(sidAsc-EXPECTED.sidAsc)<1e-7
  );

  add(
    "Sidereal MC",
    `${fmt(sidMC,8)}°`,
    Math.abs(sidMC-EXPECTED.sidMC)<1e-7
  );

  /*
    V1.10.1 FIX #1
    Swiss Ephemeris houses arrays may contain an unused
    index/metadata position depending on wrapper representation.

    We explicitly inspect positions 1..12 and do NOT use
    raw .length as the number of houses.
  */

  function usableCusps(houses){
    if(!houses) return [];
    const c=houses.cusps;

    if(!c) return [];

    const arr=[];

    /*
      Most SwissEph wrappers expose cusps as:
      [0, cusp1, cusp2, ... cusp12]
    */

    for(let i=1;i<=12;i++){
      if(Number.isFinite(Number(c[i]))){
        arr.push(Number(c[i]));
      }
    }

    /*
      Fallback for zero-based 12-element representation.
    */

    if(arr.length!==12 && c.length===12){
      const alt=[];

      for(let i=0;i<12;i++){
        if(Number.isFinite(Number(c[i]))){
          alt.push(Number(c[i]));
        }
      }

      return alt;
    }

    return arr;
  }

  const tropicalCusps=usableCusps(tropicalHouses);
  const siderealCusps=usableCusps(siderealHouses);

  add(
    "Placidus house cusps",
    `${tropicalCusps.length}/12 tropical, ${siderealCusps.length}/12 sidereal`,
    tropicalCusps.length===12 &&
    siderealCusps.length===12
  );

  const rahu=d1.find(x=>x.name==="Rahu");
  const ketu=d1.find(x=>x.name==="Ketu");

  add(
    "Rahu/Ketu opposition",
    `${fmt(angularDistance(rahu.longitude,ketu.longitude),9)}°`,
    Math.abs(
      angularDistance(rahu.longitude,ketu.longitude)-180
    )<1e-8
  );

  add(
    "D1 Lagna",
    `${SIGNS[signIndex(sidAsc)]}`,
    SIGNS[signIndex(sidAsc)]==="Dhanu"
  );

  add(
    "D1 house range",
    "All planets assigned to houses 1–12",
    d1.every(p=>p.house>=1 && p.house<=12)
  );

  add(
    "D9 sign rule",
    "All planets resolved through Navāṁśa rule",
    d9.planets.every(
      p=>p.d9Sign>=0 && p.d9Sign<12
    )
  );

  add(
    "D9 degree range",
    "All D9 degrees 0°–30°",
    d9.planets.every(
      p=>p.d9Degree>=0 && p.d9Degree<30
    )
  );

  add(
    "Vimshottari sequence",
    DASHA_SEQ.join(" → "),
    DASHA_SEQ.length===9
  );

  add(
    "Vimshottari cycle",
    `${DASHA_SEQ.reduce((a,p)=>a+DASHA_YEARS[p],0)} years`,
    DASHA_SEQ.reduce((a,p)=>a+DASHA_YEARS[p],0)===120
  );

  add(
    "Birth Nakshatra",
    `${birthNak.name} Pada ${birthNak.pada} — Lord ${birthNak.lord}`,
    birthNak.name==="Swati" &&
    birthNak.pada===2 &&
    birthNak.lord==="Rahu"
  );

  add(
    "Mahadasha generation",
    `${mahadashas.length} periods generated`,
    mahadashas.length===10
  );

  /*
    V1.10.1 FIX #2
    Count Antardashas PER Mahadasha.
    There must be exactly 9 for each of the 10 MDs.
  */

  const counts={};

  for(const ad of antardashas){
    counts[ad.md]=(counts[ad.md]||0)+1;
  }

  const mdCountsOK =
    mahadashas.every(
      md=>counts[md.planet]===9
    ) &&
    antardashas.length===90;

  add(
    "Antardasha count",
    `${antardashas.length} total — 9 per Mahadasha × ${mahadashas.length}`,
    mdCountsOK
  );

  add(
    "Current Dasha",
    `${current.md?.planet || "—"} / ${current.ad?.planet || "—"}`,
    !!current.md && !!current.ad
  );

  add(
    "Conjunction engine",
    `${conjunctionList.length} conjunction(s) within 10°`,
    true
  );

  add(
    "Graha Drishti engine",
    `${aspects.length} aspect records`,
    aspects.length>0
  );

  add(
    "House Lord engine",
    `${houseLords.length} house lords resolved`,
    houseLords.length===12
  );

  add(
    "Yoga engine",
    `${yogas.length} qualifying yoga/screening result(s)`,
    true
  );

  add(
    "Finance engine",
    `${finance.length} houses analyzed`,
    finance.length===4
  );

  add(
    "Marriage engine",
    "D1 7th + Venus + Jupiter + D9 7th analyzed",
    !!marriage
  );

  const finalPass=checks.every(x=>x.pass);

  return {
    checks,
    finalPass,
    tropicalCusps,
    siderealCusps
  };
}

/* =========================================================
   MAIN CALCULATION
========================================================= */

async function calculate(){

  await initSwiss();

  const birthDate=toUTCDate();
  const jd=getJD(birthDate);

  const ayanamsa=swe.get_ayanamsa_ut(jd);

  const houses=calculateHouses(jd);

  const tropicalAsc=
    mod(Number(houses.tropical.ascmc[0]),360);

  const tropicalMC=
    mod(Number(houses.tropical.ascmc[1]),360);

  const sidAsc=
    mod(Number(houses.sidereal.ascmc[0]),360);

  const sidMC=
    mod(Number(houses.sidereal.ascmc[1]),360);

  const planets=calculatePlanets(jd);

  const d1=buildD1(
    planets,
    sidAsc
  );

  const moon=d1.find(
    p=>p.name==="Moon"
  );

  const birthNak=nakshatraInfo(
    moon.longitude
  );

  const d9=buildD9(
    planets,
    sidAsc
  );

  const mahadashas=
    buildMahadashas(
      birthDate,
      birthNak
    );

  const antardashas=
    buildAllAntardashas(
      mahadashas
    );

  const now=new Date();

  const current=
    currentDasha(
      mahadashas,
      antardashas,
      now
    );

  const conjunctionList=
    conjunctions(d1);

  const aspects=
    buildAspects(d1);

  const combustion=
    combustionData(d1);

  const dignityList=
    strengthData(d1,d9);

  const houseLords=
    houseLordData(
      d1,
      sidAsc
    );

  const yogas=
    detectYogas(d1);

  const finance=
    financeData(
      d1,
      houseLords
    );

  const marriage=
    marriageData(
      d1,
      d9
    );

  const connections=
    dashaConnections(
      current,
      d1,
      yogas
    );

  const data={
    date:birthDate,
    jd,
    ayanamsa,
    tropicalHouses:houses.tropical,
    siderealHouses:houses.sidereal,
    tropicalAsc,
    tropicalMC,
    sidAsc,
    sidMC,
    planets,
    d1,
    d9,
