<div id="output"></div>

<script type="module">

import SwissEph from
'https://cdn.jsdelivr.net/gh/prolaxu/swisseph-wasm@v0.1.0/src/swisseph.js';

let swe = null;

const $ = id => document.getElementById(id);

const RASHIS = [
  "Mesha",
  "Vrishabha",
  "Mithuna",
  "Karka",
  "Simha",
  "Kanya",
  "Tula",
  "Vrischika",
  "Dhanu",
  "Makara",
  "Kumbha",
  "Meena"
];

const RASHI_SYMBOLS = [
  "♈","♉","♊","♋","♌","♍",
  "♎","♏","♐","♑","♒","♓"
];

const NAKSHATRAS = [
  "Ashwini",
  "Bharani",
  "Krittika",
  "Rohini",
  "Mrigashira",
  "Ardra",
  "Punarvasu",
  "Pushya",
  "Ashlesha",
  "Magha",
  "Purva Phalguni",
  "Uttara Phalguni",
  "Hasta",
  "Chitra",
  "Swati",
  "Vishakha",
  "Anuradha",
  "Jyeshtha",
  "Mula",
  "Purva Ashadha",
  "Uttara Ashadha",
  "Shravana",
  "Dhanishta",
  "Shatabhisha",
  "Purva Bhadrapada",
  "Uttara Bhadrapada",
  "Revati"
];

function norm360(x){
  x = x % 360;
  return x < 0 ? x + 360 : x;
}

function shortestDifference(a,b){
  let d = norm360(a) - norm360(b);
  if(d > 180) d -= 360;
  if(d < -180) d += 360;
  return Math.abs(d);
}

function dms(deg){
  deg = norm360(deg);
  let d = Math.floor(deg);
  let mFloat = (deg-d)*60;
  let m = Math.floor(mFloat);
  let s = Math.round((mFloat-m)*60);

  if(s === 60){
    s = 0;
    m++;
  }
  if(m === 60){
    m = 0;
    d++;
  }

  return `${String(d).padStart(2,"0")}° ${String(m).padStart(2,"0")}' ${String(s).padStart(2,"0")}"`;
}

function signInfo(longitude){
  const x = norm360(longitude);
  const index = Math.floor(x/30);
  const degree = x - index*30;

  const nakSpan = 360/27;
  const nakIndex = Math.floor(x/nakSpan);
  const withinNak = x - nakIndex*nakSpan;

  const pada = Math.floor(withinNak/(nakSpan/4))+1;

  return {
    rashiIndex:index,
    rashi:RASHIS[index],
    symbol:RASHI_SYMBOLS[index],
    degree,
    nakshatra:NAKSHATRAS[nakIndex],
    pada,
    longitude:x
  };
}

function pass(text){
  return `<div class="summary pass">✓ PASS — ${text}</div>`;
}

function warn(text){
  return `<div class="summary warn">⚠ WARNING — ${text}</div>`;
}

function fail(text){
  return `<div class="summary fail">✗ FAIL — ${text}</div>`;
}

function formatLocalUTC(date,time,offset){

  const [y,m,d] = date.split("-").map(Number);
  const [hh,mm] = time.split(":").map(Number);

  const utcMs =
    Date.UTC(y,m-1,d,hh,mm,0) -
    offset*60*60*1000;

  return new Date(utcMs);
}

function calcJulianDay(dateObj){

  const y = dateObj.getUTCFullYear();
  const m = dateObj.getUTCMonth()+1;
  const d = dateObj.getUTCDate();

  const h =
    dateObj.getUTCHours() +
    dateObj.getUTCMinutes()/60 +
    dateObj.getUTCSeconds()/3600 +
    dateObj.getUTCMilliseconds()/3600000;

  return swe.julday(y,m,d,h);
}

function getBodyPositions(jd){

  const bodies = [
    {
      name:"Sun",
      symbol:"☉",
      id:swe.SE_SUN
    },
    {
      name:"Moon",
      symbol:"☽",
      id:swe.SE_MOON
    },
    {
      name:"Mercury",
      symbol:"☿",
      id:swe.SE_MERCURY
    },
    {
      name:"Venus",
      symbol:"♀",
      id:swe.SE_VENUS
    },
    {
      name:"Mars",
      symbol:"♂",
      id:swe.SE_MARS
    },
    {
      name:"Jupiter",
      symbol:"♃",
      id:swe.SE_JUPITER
    },
    {
      name:"Saturn",
      symbol:"♄",
      id:swe.SE_SATURN
    },
    {
      name:"Rahu",
      symbol:"☊",
      id:swe.SE_MEAN_NODE
    }
  ];

  const result = [];

  const flags =
    swe.SEFLG_SWIEPH |
    swe.SEFLG_SPEED;

  const sidFlags =
    flags |
    swe.SEFLG_SIDEREAL;

  swe.set_sid_mode(swe.SE_SIDM_LAHIRI);

  for(const b of bodies){

    const tropicalRaw =
      swe.calc_ut(jd,b.id,flags);

    const siderealRaw =
      swe.calc_ut(jd,b.id,sidFlags);

    const tropical = tropicalRaw[0];
    const sidereal = siderealRaw[0];

    const si = signInfo(sidereal);

    result.push({
      name:b.name,
      symbol:b.symbol,
      tropical,
      tropicalSpeed:tropicalRaw[3],
      sidereal,
      siderealSpeed:siderealRaw[3],
      ...si
    });
  }

  return result;
}

function calculateHouses(jd,lat,lon){

  /*
    Placidus = P

    The wrapper's houses() API returns:
      cusps
      ascendant
      midheaven
      vertex
      equatorialAscendant
      coAscendantKoch
      coAscendantMunkasey
      polarAscendant

    We use the sidereal extended calculation where available.
  */

  let tropicalHouses;
  let siderealHouses;

  if(typeof swe.houses === "function"){

    tropicalHouses =
      swe.houses(
        jd,
        lat,
        lon,
        "P"
      );

  }else if(typeof swe.swe_houses === "function"){

    tropicalHouses =
      swe.swe_houses(
        jd,
        lat,
        lon,
        "P"
      );

  }else{

    throw new Error(
      "Swiss Ephemeris house calculation function is not available in this build."
    );
  }

  /*
    The v0.1.0 wrapper may expose the lower-level extended
    sidereal house function as houses_ex / swe_houses_ex.
  */

  if(typeof swe.houses_ex === "function"){

    siderealHouses =
      swe.houses_ex(
        jd,
        swe.SEFLG_SIDEREAL,
        lat,
        lon,
        "P"
      );

  }else if(typeof swe.swe_houses_ex === "function"){

    siderealHouses =
      swe.swe_houses_ex(
        jd,
        swe.SEFLG_SIDEREAL,
        lat,
        lon,
        "P"
      );

  }else{

    /*
      Safe fallback:
      tropical Ascendant minus Lahiri ayanamsa.

      This is only used if the browser wrapper does not expose
      the extended house function.
    */

    swe.set_sid_mode(swe.SE_SIDM_LAHIRI);

    const ayan =
      swe.get_ayanamsa_ut
        ? swe.get_ayanamsa_ut(jd)
        : swe.get_ayanamsa(jd);

    const tropicalAsc =
      tropicalHouses.ascendant ??
      tropicalHouses.asc ??
      tropicalHouses.ascmc?.[0];

    const tropicalMC =
      tropicalHouses.midheaven ??
      tropicalHouses.mc ??
      tropicalHouses.ascmc?.[1];

    const sidAsc = norm360(tropicalAsc - ayan);
    const sidMC  = norm360(tropicalMC - ayan);

    return {
      tropical:tropicalHouses,
      sidereal:{
        ...tropicalHouses,
        ascendant:sidAsc,
        midheaven:sidMC,
        cusps:(tropicalHouses.cusps || []).map(
          c => norm360(c-ayan)
        ),
        fallback:true,
        ayanamsa:ayan
      }
    };
  }

  return {
    tropical:tropicalHouses,
    sidereal:siderealHouses
  };
}

function getAngle(obj,name,index){

  if(obj[name] !== undefined)
    return obj[name];

  if(obj.ascmc && obj.ascmc[index] !== undefined)
    return obj.ascmc[index];

  return null;
}

function houseRows(cusps){

  if(!cusps || !cusps.length)
    return "";

  return cusps.map((c,i)=>{

    return `
      <tr>
        <td>House ${i+1}</td>
        <td>${Number(c).toFixed(8)}°</td>
        <td>${dms(c)}</td>
        <td>${signInfo(c).rashi}</td>
      </tr>
    `;

  }).join("");
}

function planetRows(planets){

  return planets.map(p=>{

    const diff =
      shortestDifference(
        p.tropical,
        p.sidereal
      );

    return `
      <tr>
        <td>${p.symbol} ${p.name}</td>
        <td>${p.tropical.toFixed(8)}°</td>
        <td>${p.sidereal.toFixed(8)}°</td>
        <td>${p.rashi}</td>
        <td>${dms(p.degree)}</td>
        <td>${p.nakshatra}</td>
        <td>${p.pada}</td>
        <td>${diff.toFixed(8)}°</td>
      </tr>
    `;

  }).join("");
}

async function calculate(){

  const output = $("output");

  try{

    output.innerHTML = "";

    const date = $("date").value;
    const time = $("time").value;
    const place = $("place").value;
    const lat = Number($("lat").value);
    const lon = Number($("lon").value);
    const offset = Number($("offset").value);

    if(!date || !time)
      throw new Error("Date and time are required.");

    if(!Number.isFinite(lat) || lat < -90 || lat > 90)
      throw new Error("Latitude must be between -90 and +90.");

    if(!Number.isFinite(lon) || lon < -180 || lon > 180)
      throw new Error("Longitude must be between -180 and +180.");

    if(!Number.isFinite(offset) || offset < -14 || offset > 14)
      throw new Error("UTC offset is invalid.");

    const utc =
      formatLocalUTC(date,time,offset);

    const jd =
      calcJulianDay(utc);

    swe.set_sid_mode(swe.SE_SIDM_LAHIRI);

    const ayan =
      swe.get_ayanamsa_ut
        ? swe.get_ayanamsa_ut(jd)
        : swe.get_ayanamsa(jd);

    const planets =
      getBodyPositions(jd);

    const houses =
      calculateHouses(
        jd,
        lat,
        lon
      );

    const tropicalAsc =
      getAngle(
        houses.tropical,
        "ascendant",
        0
      );

    const tropicalMC =
      getAngle(
        houses.tropical,
        "midheaven",
        1
      );

    const siderealAsc =
      getAngle(
        houses.sidereal,
        "ascendant",
        0
      );

    const siderealMC =
      getAngle(
        houses.sidereal,
        "midheaven",
        1
      );

    if(
      tropicalAsc === null ||
      siderealAsc === null
    ){
      throw new Error(
        "Ascendant could not be obtained from Swiss Ephemeris."
      );
    }

    const ascInfo =
      signInfo(siderealAsc);

    const mcInfo =
      signInfo(siderealMC);

    const ascDifference =
      shortestDifference(
        tropicalAsc,
        siderealAsc
      );

    const mcDifference =
      shortestDifference(
        tropicalMC,
        siderealMC
      );

    const ascAyanCheck =
      Math.abs(
        ascDifference - ayan
      );

    const mcAyanCheck =
      Math.abs(
        mcDifference - ayan
      );

    const ascPass =
      ascAyanCheck < 0.01;

    const mcPass =
      mcAyanCheck < 0.01;

    const houseCount =
      houses.sidereal.cusps
        ? houses.sidereal.cusps.length
        : 0;

    const housePass =
      houseCount === 12;

    const rahu =
      planets.find(
        p => p.name === "Rahu"
      );

    const ketu =
      {
        name:"Ketu",
        symbol:"☋",
        tropical:norm360(rahu.tropical+180),
        sidereal:norm360(rahu.sidereal+180),
        tropicalSpeed:-rahu.tropicalSpeed,
        siderealSpeed:-rahu.siderealSpeed,
        ...signInfo(norm360(rahu.sidereal+180))
      };

    const outputJSON = {

      version:"KundaliVeda V1.3",

      input:{
        place,
        date,
        localTime:time,
        offset,
        utcDate:utc.toISOString(),
        latitude:lat,
        longitude:lon
      },

      julianDay:jd,

      ayanamsa:ayan,

      lagna:{
        tropical:tropicalAsc,
        sidereal:siderealAsc,
        rashi:ascInfo.rashi,
        degree:ascInfo.degree,
        nakshatra:ascInfo.nakshatra,
        pada:ascInfo.pada
      },

      mc:{
        tropical:tropicalMC,
        sidereal:siderealMC,
        rashi:mcInfo.rashi,
        degree:mcInfo.degree
      },

      houses:{
        system:"Placidus",
        tropical:houses.tropical,
        sidereal:houses.sidereal
      },

      planets,
      ketu,

      validation:{
        ascendantAyanamsaDifference:ascDifference,
        ascendantAyanamsaError:ascAyanCheck,
        ascendantConsistent:ascPass,
        mcAyanamsaDifference:mcDifference,
        mcAyanamsaError:mcAyanCheck,
        mcConsistent:mcPass,
        houseCount,
        twelveHouses:housePass
      }

    };

    let html = `

      <div class="card">

        <h2>🔎 1. V1.3 Validation Summary</h2>

        ${pass(
          `UTC conversion — ${date} ${time} UTC${offset >= 0 ? "+" : ""}${offset}
           → ${utc.toISOString()}`
        )}

        ${pass(
          `Julian Day — JD = ${jd.toFixed(8)}`
        )}

        ${pass(
          `Lahiri Ayanamsa — ${ayan.toFixed(8)}°`
        )}

        ${
          ascPass
          ? pass(
            `Tropical → Sidereal Ascendant consistency —
             difference ${ascDifference.toFixed(8)}°`
          )
          : warn(
            `Ascendant difference ${ascDifference.toFixed(8)}°
             differs from the calculated ayanamsa by
             ${ascAyanCheck.toFixed(8)}°`
          )
        }

        ${
          mcPass
          ? pass(
            `Tropical → Sidereal MC consistency —
             difference ${mcDifference.toFixed(8)}°`
          )
          : warn(
            `MC difference ${mcDifference.toFixed(8)}°
             differs from the calculated ayanamsa by
             ${mcAyanCheck.toFixed(8)}°`
          )
        }

        ${
          housePass
          ? pass("12 Placidus house cusps returned")
          : warn(
            `House cusp count returned: ${houseCount}`
          )
        }

      </div>

      <div class="card">

        <h2>🕐 2. Time Conversion</h2>

        <p>
          <b>Place:</b> ${place}
        </p>

        <p>
          <b>Local:</b> ${date} ${time} UTC${offset >= 0 ? "+" : ""}${offset}
        </p>

        <p>
          <b>Converted UTC:</b> ${utc.toISOString()}
        </p>

        <p>
          <b>Latitude:</b> ${lat}
          &nbsp;&nbsp;
          <b>Longitude:</b> ${lon}
        </p>

      </div>

      <div class="card">

        <h2>📐 3. Julian Day</h2>

        <div class="lagnaBox">
          <div class="bigDegree">
            ${jd.toFixed(8)}
          </div>
          <div class="small">
            Swiss Ephemeris Julian Day — Universal Time
          </div>
        </div>

      </div>

      <div class="card">

        <h2>🌌 4. Lahiri Ayanamsa</h2>

        <div class="lagnaBox">
          <div class="bigDegree">
            ${ayan.toFixed(8)}°
          </div>
          <div>
            ${dms(ayan)}
          </div>
          <div class="small">
            Swiss Ephemeris • SE_SIDM_LAHIRI
          </div>
        </div>

      </div>

      <div class="card">

        <h2>🔱 5. Lagna / Ascendant</h2>

        <div class="lagnaBox">

          <div class="lagnaSign">
            ${ascInfo.symbol}
            ${ascInfo.rashi}
          </div>

          <div class="bigDegree">
            ${dms(ascInfo.degree)}
          </div>

          <p>
            Sidereal longitude:
            <b>${siderealAsc.toFixed(8)}°</b>
          </p>

          <p>
            Nakshatra:
            <b>${ascInfo.nakshatra}</b>
            &nbsp; • &nbsp;
            Pada:
            <b>${ascInfo.pada}</b>
          </p>

        </div>

        <table>

          <tr>
            <th>Item</th>
            <th>Longitude</th>
            <th>Difference from Sidereal</th>
          </tr>

          <tr>
            <td>Tropical Ascendant</td>
            <td>${tropicalAsc.toFixed(8)}°</td>
            <td>—</td>
          </tr>

          <tr>
            <td>Lahiri Sidereal Ascendant</td>
            <td>${siderealAsc.toFixed(8)}°</td>
            <td>${ascDifference.toFixed(8)}°</td>
          </tr>

          <tr>
            <td>Lahiri Ayanamsa</td>
            <td>${ayan.toFixed(8)}°</td>
            <td>
              Error:
              ${ascAyanCheck.toFixed(8)}°
            </td>
          </tr>

        </table>

      </div>

      <div class="card">

        <h2>📍 6. Midheaven / MC</h2>

        <table>

          <tr>
            <th>Item</th>
            <th>Tropical</th>
            <th>Sidereal</th>
          </tr>

          <tr>
            <td>MC</td>
            <td>${tropicalMC.toFixed(8)}°</td>
            <td>${siderealMC.toFixed(8)}°</td>
          </tr>

          <tr>
            <td>Rashi</td>
            <td>${signInfo(tropicalMC).rashi}</td>
            <td>${mcInfo.rashi}</td>
          </tr>

          <tr>
            <td>Degree</td>
            <td>${dms(
              signInfo(tropicalMC).degree
            )}</td>
            <td>${dms(mcInfo.degree)}</td>
          </tr>

          <tr>
            <td>Sidereal separation</td>
            <td colspan="2">
              ${mcDifference.toFixed(8)}°
            </td>
          </tr>

        </table>

      </div>

      <div class="card">

        <h2>🏠 7. Placidus House Cusps</h2>

        <p class="small">
          House system: Placidus (P)
        </p>

        <table>

          <tr>
            <th>House</th>
            <th>Sidereal Longitude</th>
            <th>Degree</th>
            <th>Rashi</th>
          </tr>

          ${
            houseRows(
              houses.sidereal.cusps
            )
          }

        </table>

        ${
          houses.sidereal.fallback
          ? warn(
            "The wrapper did not expose the extended sidereal house method, so the sidereal house values were derived by subtracting the Lahiri ayanamsa from the tropical house values."
          )
          : pass(
            "Sidereal house calculation obtained from the Swiss Ephemeris house API."
          )
        }

      </div>

      <div class="card">

        <h2>🪐 8. Planetary Positions</h2>

        <table>

          <tr>
            <th>Planet</th>
            <th>Tropical</th>

        </p>

      </div>

    `;

    output.innerHTML = html;

  }catch(err){

    output.innerHTML = `
      <div class="card">
        <div class="error">
          <b>Calculation Error</b><br><br>
          ${escapeHTML(
            err?.message || String(err)
          )}
        </div>
      </div>
    `;

    console.error(err);
  }
}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

(async()=>{

    swe = new SwissEph();
